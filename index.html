<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farofa da Fê - Confirmação de Presença</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FFDF00',
              orange: '#FF5E36',
              pink: '#E91E63',
              darkpink: '#C2185B',
              teal: '#00BFA5',
              bgLight: '#FFF5E6',
            }
          },
          fontFamily: {
            display: ['Caveat', 'cursive'],
            title: ['Fredoka', 'sans-serif'],
            body: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Estilo de Luzes de Varal */
    @keyframes bulbGlow {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 223, 0, 0.8)); }
      50% { opacity: 0.6; transform: scale(0.95); filter: drop-shadow(0 0 2px rgba(255, 223, 0, 0.3)); }
    }

    .bulb {
      animation: bulbGlow 2s infinite ease-in-out alternate;
    }

    .bulb:nth-child(2n) { animation-delay: 0.3s; }
    .bulb:nth-child(3n) { animation-delay: 0.7s; }
    .bulb:nth-child(5n) { animation-delay: 1.1s; }

    /* Estilo de Placa de Madeira */
    .wood-sign {
      background: #c26928;
      background: linear-gradient(135deg, #a0522d 0%, #8b4513 50%, #68300a 100%);
      border: 3px solid #4a2306;
      box-shadow: 0 8px 0 #3a1a03, 0 12px 20px rgba(0,0,0,0.3);
    }

    .bg-festive-pattern {
      background-color: #f7a93b;
      background-image: radial-gradient(#ff6b6b 2px, transparent 2px), radial-gradient(#ffe66d 2px, #f7a93b 2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
  </style>
</head>
<body class="bg-festive-pattern font-body text-gray-800 min-h-screen pb-12 overflow-x-hidden selection:bg-pink-500 selection:text-white">

  <!-- Varal de Luzes Decorativo Decorando o Topo -->
  <div class="w-full relative h-16 bg-gradient-to-b from-black/20 to-transparent flex justify-between items-start px-4 pt-1 z-20 pointer-events-none">
    <div class="flex w-full justify-around items-center border-b-2 border-amber-900/40 relative pb-2">
      <div class="bulb w-5 h-7 bg-amber-300 rounded-full border border-amber-500 shadow-lg"></div>
      <div class="bulb w-5 h-7 bg-pink-500 rounded-full border border-pink-700 shadow-lg"></div>
      <div class="bulb w-5 h-7 bg-yellow-400 rounded-full border border-yellow-600 shadow-lg"></div>
      <div class="bulb w-5 h-7 bg-cyan-400 rounded-full border border-cyan-600 shadow-lg"></div>
      <div class="bulb w-5 h-7 bg-rose-500 rounded
